worker_processes auto;
events { worker_connections 4096; }

http {
    access_log off;

    keepalive_requests 100000;
    keepalive_timeout 75s;

    upstream hackernews_api {
        server api1:8080 max_fails=2 fail_timeout=5s;
        server api2:8080 max_fails=2 fail_timeout=5s;
        server api3:8080 max_fails=2 fail_timeout=5s;
        keepalive 32;
    }

    server {
        listen 80;

        add_header X-Upstream $upstream_addr always;

        location / {
            proxy_pass         http://hackernews_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_next_upstream error timeout http_502 http_503;
        }

        location = /lb-health {
            proxy_pass http://hackernews_api/health/live;
        }
    }
}
